[package]
name = "noizen"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An offline foreground ambient sound mixer"
repository = "https://github.com/nendix/noizen"
homepage = "https://github.com/nendix/noizen"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = "3.5.2"
directories = "6.0.0"
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.8"

[dev-dependencies]
rustfft = "6.4.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
