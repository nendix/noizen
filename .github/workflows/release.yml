name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - name: Check version and quality
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET"
          name="noizen-$RELEASE_TAG-$TARGET"
          mkdir -p "dist/$name/completions" "dist/$name/assets"
          cp "target/$TARGET/release/noizen" "dist/$name/"
          "dist/$name/noizen" --version
          for shell in bash zsh fish; do
            "dist/$name/noizen" completions "$shell" > "dist/$name/completions/noizen.$shell"
          done
          cp assets/README.md assets/CC-BY-4.0.txt "dist/$name/assets/"
          cp README.md AGENTS.md "dist/$name/"
          cp -R docs "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: noizen-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: noizen-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and Homebrew formula
        run: python3 tools/release.py "$RELEASE_TAG" dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/noizen.rb \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes 'MVP candidate. Hardware listening acceptance is still pending. Includes recording licenses and shell completions. See README for OS audio dependencies.'
